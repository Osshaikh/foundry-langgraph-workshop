[project]
name = "foundry-langgraph-workshop"
version = "0.1.0"
description = "Hands-on workshop: build LangGraph agents and host them on Microsoft Foundry (Hosted Agents)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

# Runtime dependencies the lab notebooks import. Hosted agents have their OWN
# pinned requirements.txt under agents/<lab>/src/<agent>/ — those are what run
# inside Foundry. Versions below are the validated "known-good" set.
dependencies = [
    # LangGraph + Foundry hosting adapter
    "langchain-azure-ai[hosting,opentelemetry]==1.2.9",
    "langchain==1.3.15",
    "langchain-core==1.5.5",
    "langchain-openai==1.5.1",
    "langgraph==1.2.11",
    "langchain-mcp-adapters>=0.2.1",
    "deepagents>=0.3.0",
    # Foundry SDKs
    "azure-ai-projects==2.4.0",
    "azure-identity>=1.25.3",
    "openai>=2.54.0,<3",
    "httpx>=0.28.1,<1",
    # RAG (M4)
    "azure-search-documents>=11.6.0",
    # Evaluation + red teaming (M9, M12)
    "azure-ai-evaluation[redteam]>=1.16.0",
    # Observability (M10)
    "azure-monitor-query>=1.4.0",
    # Utilities
    "python-dotenv>=1.2.1",
    "pandas>=2.2",
    "requests>=2.32",
    "rich>=13.0",
    "pyyaml>=6.0",
    # Notebook runtime
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
    "pymdown-extensions>=10.7",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop"]
