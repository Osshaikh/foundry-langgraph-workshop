# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: lgws-m06-memory-responses
services:
  lgws-m06-memory-responses:
    host: azure.ai.agent
    project: src/memory-responses
    language: python
    kind: hosted
    name: lgws-m06-memory-responses
    displayName: M6 Agent Memory (Responses)
    description: Responses hosted agent without a LangGraph checkpointer, for platform conversation history.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: '-m langchain_azure_ai.agents.hosting.run --protocol responses'
    startupCommand: python -m langchain_azure_ai.agents.hosting.run --protocol responses
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
