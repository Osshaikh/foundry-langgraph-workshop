# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: lgws-m08-deep-research
services:
  lgws-m08-deep-research:
    host: azure.ai.agent
    project: src/deep-research
    language: python
    kind: hosted
    name: lgws-m08-deep-research
    displayName: M8 Deep Research Agent
    description: DeepAgents research assistant with planning, web search toolbox, and focused research sub-agent.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: '-m langchain_azure_ai.agents.hosting.run --protocol responses'
    startupCommand: python -m langchain_azure_ai.agents.hosting.run --protocol responses
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: lgws-m08-research-tools
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
