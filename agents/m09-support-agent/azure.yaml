# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.12'
name: lgws-m09-support-agent
services:
  lgws-m09-support-agent:
    host: azure.ai.agent
    project: src/support-agent
    language: python
    kind: hosted
    name: lgws-m09-support-agent
    displayName: M9-M12 Contoso Outdoor Support Agent
    description: Contoso Outdoor support agent for quality, observability, guardrails, and red-team labs.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: '-m langchain_azure_ai.agents.hosting.run --protocol responses'
    startupCommand: python -m langchain_azure_ai.agents.hosting.run --protocol responses
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      OTEL_AUTO_CONFIGURE_AZURE_MONITOR: ${OTEL_AUTO_CONFIGURE_AZURE_MONITOR}
      AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: ${AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED}
      AZURE_TRACING_ALL_LANGGRAPH_NODES: ${AZURE_TRACING_ALL_LANGGRAPH_NODES}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
