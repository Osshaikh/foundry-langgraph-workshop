# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: lgws-m14-ft-agent
services:
  lgws-m14-ft-agent:
    host: azure.ai.agent
    project: src/ft-agent
    language: python
    kind: hosted
    name: lgws-m14-ft-agent
    displayName: M14 Fine-tuned Support Agent
    description: LangGraph support-reply agent that uses the selected Foundry model deployment, including the M14 fine-tuned deployment.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: '-m langchain_azure_ai.agents.hosting.run --protocol responses'
    startupCommand: python -m langchain_azure_ai.agents.hosting.run --protocol responses
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
